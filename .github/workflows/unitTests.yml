name: Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The same command as locally (tools/check.py): tests, ruff lint and
      # format, translation catalog. Pyright is skipped here: it needs NVDA's sources.
      - name: Run all checks
        run: uv run python tools/check.py
